# X-ray 骨骼分割和分类 - 配置模板
# 这是一个完整的配置文件模板，可以直接复制使用

# 实验基本配置
exp_name: "xray_bone_exp"
seed: 42
device: "cuda"

# 数据配置
data:
  # 数据路径（必填）
  image_dir: "./data/images"
  mask_dir: "./data/masks"
  train_dataset: "./data/labels/train.csv"
  val_dataset: "./data/labels/val.csv"
  test_dataset: "./data/labels/test.csv"

  # Mask配置
  single_mask: true
  mask_key: "bone"

  # 图像预处理
  target_shape: [512, 512]
  use_augmentation: true
  flip_prob: 0.5
  rotate_prob: 0.3
  max_angle: 15

  # 数据加载
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  use_preprocessed: false

# 模型配置
model:
  model_type: "dinov3_v2"
  vit_arch: "vit_base"
  dinov3_pretrained: ""
  input_depth: 1

  # 分割配置
  enable_segmentation: true
  seg_organs: ["bone"]

  # 分类任务配置（必填，根据你的CSV列名修改）
  num_classes:
    femur_fracture: 2
    pelvis_fracture: 2
    spine_fracture: 2
    joint_dislocation: 2

  # 特征配置
  top_k_ratio: 0.2
  dropout: 0.1
  use_task_interaction: true

# 训练配置
training:
  batch_size: 8
  epochs: 50
  optimizer: "adamw"
  lr: 0.0001
  weight_decay: 0.0001
  scheduler: "cosine"
  min_lr: 0.000001
  loss_type: "BCE"
  focal_loss_alpha: 0.25
  focal_loss_gamma: 2.0
  seg_loss_weight: 0.5
  class_weights: {}
  use_amp: true
  gradient_clip: 1.0
  save_interval: 5

# 日志配置
log:
  log_dir: "./logs/xray_bone"
  checkpoint_dir: "./checkpoints/xray_bone"
  tensorboard_dir: "./runs/xray_bone"
  save_best: true
  metric_for_best: "avg_f1"
