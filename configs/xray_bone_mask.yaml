# X-ray骨平片配置文件 - 单骨骼分割 + DINOv3
# ============================================================

exp_name: "xray_bone_dinov3"
seed: 42
device: "cuda"

# 数据配置
data:
  dataset_class: "XrayDataset"           # 使用单张X-ray数据集
  image_dir: "/path/to/xray/images"
  mask_dir: "/path/to/xray/masks"
  train_dataset: "/path/to/labels/train.csv"
  val_dataset: "/path/to/labels/val.csv"
  test_dataset: "/path/to/labels/test.csv"

  # Mask配置
  single_mask: true
  mask_key: "mask"                       # npz文件的键名

  # 图像预处理
  target_shape: [512, 512]               # 输入图像大小
  use_augmentation: true
  flip_prob: 0.5
  rotate_prob: 0.3
  max_angle: 15

  # 数据加载
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  persistent_workers: false
  use_preprocessed: false

# 模型配置
model:
  model_type: "dinov3_v2"               # 使用DINOv3 V2
  vit_arch: "vit_base"                   # vit_small, vit_base, vit_large, vit_giant
  dinov3_pretrained: "/path/to/dinov3_vitb16_pretrain.pth"
  input_depth: 1                         # 灰度图X-ray

  # 分割配置
  enable_segmentation: true
  seg_organs: ["bone"]                   # 单骨骼分割

  # 分类任务配置
  num_classes:
    femur_fracture: 2
    pelvis_fracture: 2
    spine_fracture: 2
    joint_dislocation: 2

  # 注意力/Top-K特征配置
  top_k_ratio: 0.2
  dropout: 0.1
  use_task_interaction: true

# 训练配置
training:
  batch_size: 8
  epochs: 50
  optimizer: "adamw"
  lr: 1e-4
  weight_decay: 1e-4
  scheduler: "cosine"
  min_lr: 1e-6
  loss_type: "BCE"
  focal_loss_alpha: 0.25
  focal_loss_gamma: 2.0
  seg_loss_weight: 0.5
  class_weights: {}
  use_amp: true
  gradient_clip: 1.0
  save_interval: 5

# 日志配置
log:
  log_dir: "./logs/xray_bone"
  checkpoint_dir: "./checkpoints/xray_bone"
  tensorboard_dir: "./runs/xray_bone"
  save_best: true
  metric_for_best: "avg_f1"
